<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お店のこだわり</title>
</head>
<body>
    <h1>お店のこだわり</h1>
    <section class="commitment">
    <div class="container">
        <div class="section-header">
        <span class="sub-title">CONCEPT</span>
        <h2 class="main-title">一杯の珈琲と、豊かな時間。</h2>
        <div class="accent-line"></div>
    </div>

    /*奇数番目*/
    <div class="odd-item">
        <div class="odd-image">
            <img src="image.jpg" alt="コーヒー豆">
        </div>
        <div class="odd-text">
            <span class="odd-number">01</span>
            <h3>自家焙煎の厳選スペシャリティコーヒー</h3>
            <p>
            世界中から厳選した品質の高い生豆のみを仕入れ、その日の気温や湿度に合わせて自社焙煎を行っています。豆本来が持つフルーティーな香りと豊かなコクを最大限に引き出した、こだわりの一杯をお楽しみください。
            </p>
        </div>
      </div>

      /*偶数番目*/
    <div class="even-item">
        <div class="even-image">
            <img src="image2.jpg" alt="店内">
        </div>
        <div class="even-text">
            <span class="even-number">02</span>
            <h3></h3>
        </div>
    </div>

</body>
</html>
